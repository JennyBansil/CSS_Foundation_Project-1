<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Website HTML and CSS</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts Links For Icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  </head>
  <body>
    <!--Navigation Bar-->
    <header>
      <nav class="navbar">
        <a class="logo" href="#">Savoré<span>.</span></a>
        <ul class="menu-links">
          <span id="close-menu-btn" class="material-symbols-outlined">close</span>
          <li><a href="#">Home</a></li>
          <li><a href="#">Menus</a></li>
          <li><a href="#">Testimonials</a></li>
          <li><a href="#">About us</a></li>
          <li><a href="#">Contact us</a></li>
        </ul>
        <span id="hamburger-btn" class="material-symbols-outlined">menu</span>
      </nav>
    </header>
    <!--Hero Section--> 
    <section class="hero-section">
      <div class="content">
        <h2>A Taste Worth Sharing</h2>
        <p>
          Discover delicious flavors, freshly prepared dishes, and memorable moments at Savoré.
        </p>
        <div class="button-container">
          <button class="menu-btn">Explore Our Menu</button>
          <button>Reservation</button>
        </div>
      </div>
    </section>
    <footer>
        <p>&copy; 2026 by Jenny Bansil. All rights reserved.</p>
      </footer>
    <!--JavaScript--> 
    <script>
      const header = document.querySelector("header");
      const hamburgerBtn = document.querySelector("#hamburger-btn");
      const closeMenuBtn = document.querySelector("#close-menu-btn");

      // Toggle mobile menu on hamburger button click
      hamburgerBtn.addEventListener("click", () => header.classList.toggle("show-mobile-menu"));

      // Close mobile menu on close button click
      closeMenuBtn.addEventListener("click", () => hamburgerBtn.click());
    </script>
    
  </body>
</html>
